name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Quality Gate
        run: just check

      - name: Build Mod Artifacts
        run: just build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/build/libs/emerald-essentials-fabric-*.jar
            neoforge/build/libs/emerald-essentials-neoforge-*.jar
            !fabric/build/libs/*-sources.jar
            !neoforge/build/libs/*-sources.jar
          generate_release_notes: true
          draft: false
          prerelease: false
