name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Quality Gate
        run: just check

      - name: Build Artifacts
        run: just build

      - name: Upload Mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: emerald-essentials-jars
          path: |
            fabric/build/libs/emerald-essentials-fabric-*.jar
            neoforge/build/libs/emerald-essentials-neoforge-*.jar
            !fabric/build/libs/*-sources.jar
            !neoforge/build/libs/*-sources.jar
          retention-days: 7
